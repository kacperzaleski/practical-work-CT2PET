# UNet Attention Map Segmentation Configuration
# Train the segmentation model to generate attention maps from CT

data:
  dataset_name: 'CT2PET_autoPET'
  dataset_type: 'custom_aligned'
  dataset_config:
    # Data paths
    data_root: '/home/kacperzaleski/Projects/practical-work-CT2PET/data/processed'
    ct_max: 3071
    pet_max: 32
    
    # Image configuration
    image_size: 64
    channels: 1
    target_image_size: 64
    
    # Normalization
    to_normal: True
    flip: True
    
  train:
    batch_size: 32
    shuffle: True
    num_workers: 4
    
  val:
    batch_size: 32
    shuffle: False
    num_workers: 2
    
  test:
    batch_size: 32
    shuffle: False
    num_workers: 2

model:
  # UNet for attention map segmentation
  AttentionMapSegmentation:
    model_type: UNet
    in_channels: 1
    out_channels: 1
    features: [64, 128, 256, 512]
    dropout_rate: 0.1
    use_batch_norm: True
    
    # Loss configuration
    loss_type: dice  # Dice loss for segmentation
    loss_weight: 1.0
  
  model_name: AttentionMapSegmentation
  model_type: UNetSegmentation

runner: SegmentationRunner

training:
  accumulate_grad_batches: 1
  n_epochs: 50
  n_steps: 50000
  
  sample_interval: 2
  save_interval: 2
  validation_interval: 2
  
  log_interval: 100
  use_amp: False
  grad_clip: 1.0
  
  # Learning rate
  lr: 0.001
  lr_scheduler: CosineAnnealingLR
  warmup_epochs: 5

testing:
  metrics:
    - dice
    - iou
    - accuracy

paths:
  results_dir: '/home/kacperzaleski/Projects/practical-work-CT2PET/results/AttentionMap'
  checkpoint_dir: '/home/kacperzaleski/Projects/practical-work-CT2PET/checkpoints/AttentionMap'
  log_dir: '/home/kacperzaleski/Projects/practical-work-CT2PET/logs/AttentionMap'

wandb:
  project: 'CT2PET-AttentionMap'
  entity: null
  name: 'UNet-AttentionMap-AutoPET-64x64'
  notes: 'UNet training for attention map generation from CT'
  log_frequency: 100
