# VQGAN Training Configuration
# Train the encoder/decoder first before training the diffusion model

data:
  dataset_name: 'CT2PET_autoPET'
  dataset_type: 'ct2pet_aligned'
  dataset_config:
    # Data paths
    data_root: '/home/kacperzaleski/Projects/practical-work-CT2PET/data/processed'

    # Image configuration
    image_size: 64
    channels: 1

    # Already normalized to [-1, 1] in preprocessing.
    to_normal: True
    flip: True
    
  train:
    batch_size: 32
    shuffle: True
    num_workers: 4
    
  val:
    batch_size: 32
    shuffle: False
    num_workers: 2
    
  test:
    batch_size: 32
    shuffle: False
    num_workers: 2

model:
  VQGAN:
    params:
      ddconfig:
        attn_resolutions: []
        ch: 128
        ch_mult: !!python/tuple [1, 2, 4]
        double_z: False
        dropout: 0.0
        in_channels: 1
        out_ch: 1
        num_res_blocks: 2
        resolution: 64
        z_channels: 4
      
      embed_dim: 4
      n_embed: 8192
      
      lossconfig:
        target: torch.nn.Identity
      
      # Loss configuration
      disc_factor: 1.0
      disc_weight: 0.75
      codebook_weight: 1.0
      perceptual_weight: 1.0
  
  discriminator:
    params:
      n_layers: 3
    
  model_name: VQGAN
  model_type: VQGAN

runner: VQGANRunner

training:
  accumulate_grad_batches: 1
  n_epochs: 100
  n_steps: 100000
  
  sample_interval: 5
  save_interval: 5
  validation_interval: 5
  
  log_interval: 100
  use_amp: False
  grad_clip: 1.0

testing:
  clip_denoised: False
  sample_num: 1

paths:
  results_dir: '/home/kacperzaleski/Projects/practical-work-CT2PET/results/VQGAN'
  checkpoint_dir: '/home/kacperzaleski/Projects/practical-work-CT2PET/checkpoints/VQGAN'
  log_dir: '/home/kacperzaleski/Projects/practical-work-CT2PET/logs/VQGAN'

wandb:
  project: 'CT2PET-VQGAN'
  entity: null
  name: 'VQGAN-AutoPET-64x64'
  notes: 'VQGAN training for CT-PET encoder/decoder'
  log_frequency: 100
