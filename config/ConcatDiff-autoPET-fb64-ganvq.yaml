# Concatenation-conditioned latent diffusion (Diffusion 2) — on the adversarial (GAN) VQGAN latent.
#
# Identical to config/ConcatDiff-autoPET-fb64.yaml except model.VQGAN.params.ckpt_path points at the
# adversarially trained VQGAN (checkpoints/VQGAN_gan_fb64/best.ckpt). This is the SAME latent CPDM
# uses in config/CPDM-autoPET-fb64-ganvq-focal.yaml, so the within-diffusion comparison stays fair.
# A new latent => the denoiser must be retrained from scratch (the old ConcatDiff checkpoint is
# invalid), and the run must write to a fresh checkpoint dir so current results are preserved:
#
#   setsid nohup .venv/bin/python training/train_concat_diffusion.py \
#       --config config/ConcatDiff-autoPET-fb64-ganvq.yaml --data-root data/processed_fullbody \
#       --batch-size 8 --ckpt-dir checkpoints/ConcatDiff_ganvq --wandb-name ConcatDiff-ganvq \
#       < /dev/null > logs/concatdiff_ganvq.log 2>&1 &
#
# Sample + dump [0,1] .npy for sampling_eval/eval_masked.py:
#   python sampling_eval/sample_concat_diffusion.py --ckpt checkpoints/ConcatDiff_ganvq/last.ckpt \
#       --num-steps 200 --save-npy results/eval/concatdiff_ganvq

data:
  dataset_name: 'CT2PET_autoPET_fullbody'
  dataset_type: 'ct2pet_aligned'
  dataset_config:
    data_root: '/home/kacperzaleski/Projects/practical-work-CT2PET/data/processed_fullbody'
    image_size: 64
    channels: 1
    to_normal: True
    flip: True
    max_pixel_cond: 1.0
    max_pixel_ori: 1.0
    max_samples:
      train: 5000
      val: 800
      test: 1000

model:
  # Frozen adversarial (GAN) VQGAN — identical latent to config/CPDM-autoPET-fb64-ganvq-focal.yaml.
  VQGAN:
    params:
      ddconfig:
        attn_resolutions: []
        ch: 128
        ch_mult: !!python/tuple [1, 2, 4]
        double_z: False
        dropout: 0.0
        in_channels: 1
        out_ch: 1
        num_res_blocks: 2
        resolution: 64
        z_channels: 4
      embed_dim: 4
      n_embed: 8192
      lossconfig:
        target: torch.nn.Identity
      ckpt_path: '/home/kacperzaleski/Projects/practical-work-CT2PET/checkpoints/VQGAN_gan_fb64/best.ckpt'

  # Denoiser — OpenAI UNetModel. in=8 (4 noisy PET latent + 4 CT-latent context;
  # condition_key=concat makes the model concatenate context internally), out=4.
  # Lighter than CPDM: model_channels 64, no attention (attention_resolutions []).
  UNetParams:
    image_size: 16
    in_channels: 8
    out_channels: 4
    model_channels: 64
    num_res_blocks: 2
    attention_resolutions: !!python/tuple []
    channel_mult: !!python/tuple [1, 2, 4]
    num_heads: 1
    num_head_channels: -1
    condition_key: concat
    context_dim: null
    use_spatial_transformer: False
    use_scale_shift_norm: True
    resblock_updown: True
    conv_resample: True
    dims: 2

  diffusion:
    num_timesteps: 1000
    beta_start: 0.0001
    beta_end: 0.02
    sample_step: 200

wandb:
  project: 'CT2PET-ConcatDiff'
  entity: null
  name: 'ConcatDiff-ganvq'
  notes: 'Concat-conditioned latent diffusion (Diffusion 2) in the adversarial (GAN) VQGAN latent'
  log_frequency: 100
