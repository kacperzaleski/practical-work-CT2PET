# CPDM: CT-to-PET Diffusion Model Configuration
# Complete training pipeline including VQGAN, Brownian Bridge Diffusion, and UNet Attention Map

data:
  dataset_name: 'CT2PET_autoPET'
  dataset_type: 'ct2pet_aligned'
  dataset_config:
    # Data paths
    data_root: '/home/kacperzaleski/Projects/practical-work-CT2PET/data/processed'

    # Image configuration
    image_size: 64
    channels: 1   # Single channel for each modality

    # Already normalized to [-1, 1] in preprocessing; runner uses to_normal for image-grid rendering.
    to_normal: True
    flip: True

    # max_pixel_cond / max_pixel_ori are referenced by CPDMRunner.sample_to_eval to invert
    # the runner-side save normalization. Our data is already in [-1, 1] so a passthrough
    # of 1.0 leaves saved arrays untouched.
    max_pixel_cond: 1.0
    max_pixel_ori: 1.0

    # Per-split cap on dataset size. Keeps a CPU "epoch" bounded so the runner's
    # full-DataLoader iteration in BaseRunner.train() finishes in reasonable time.
    max_samples:
      train: 2000
      val: 200
      test: 200
    
  # Note: BaseRunner.train hardcodes num_workers=24; the worker count here is informational.
  train:
    batch_size: 8
    shuffle: True
    num_workers: 4

  val:
    batch_size: 8
    shuffle: False
    num_workers: 2

  test:
    batch_size: 8
    shuffle: False
    num_workers: 2

model:
  # VQGAN Configuration (Encoder/Decoder)
  VQGAN:
    # Model checkpoint path (set after VQGAN training)
    ckpt_path: null
    # VQGAN architecture parameters
    params:
      ddconfig:
        attn_resolutions: []
        ch: 128
        ch_mult: !!python/tuple [1, 2, 4]
        double_z: False
        dropout: 0.0
        in_channels: 1
        out_ch: 1
        num_res_blocks: 2
        resolution: 64
        z_channels: 4
      
      embed_dim: 4
      n_embed: 8192
      
      lossconfig:
        target: torch.nn.Identity

      # VQGAN checkpoint trained by train_vqgan.py (Lightning ckpt with `state_dict` key).
      # CT2PETDiffusionModel.__init__ instantiates VQModel(**vars(params)); VQModel.init_from_ckpt
      # reads sd['state_dict'] and loads with strict=False so extra Lightning keys are ignored.
      ckpt_path: '/home/kacperzaleski/Projects/practical-work-CT2PET/checkpoints/VQGAN/vqgan-epoch=01-v2.ckpt'

  # Brownian Bridge Diffusion Model (Main model)
  BB:
    # Learning rate scheduler
    lr_scheduler:
      cooldown: 3000
      factor: 0.5
      min_lr: 5.0e-07
      patience: 3000
      threshold: 0.0001
    
    # Optimizer configuration
    optimizer:
      beta1: 0.9
      lr: 0.0001
      optimizer: Adam
      weight_decay: 0.0
    
    # Model parameters
    params:
      UNetParams:
        # Denoiser operates on the VQGAN latent: 4 × 16 × 16 (not the 64×64 pixel input).
        # Paper uses 256×256 input → 4× downsampling VQGAN → 64 latent and attention at {32,16,8};
        # our 64×64 input → 4× downsampling VQGAN → 16 latent, so we scale attention proportionally.
        attention_resolutions: !!python/tuple [8, 4]
        channel_mult: !!python/tuple [1, 2, 3, 4]
        condition_key: SpatialRescaler
        context_dim: null
        conv_resample: True
        dims: 2
        image_size: 16
        # Channel composition at UNet input: x_t (z_channels=4) + cat([SR(att_map), SR(atte_map)])
        # where each SpatialRescaler outputs CondStageParams.out_channels = z_channels = 4.
        # Total = 4 + 4 + 4 = 12. Matches original Template-CPDM's 3·z_channels rule (3+3+3 = 9).
        in_channels: 12
        model_channels: 128
        num_head_channels: 64
        num_heads: 8
        num_res_blocks: 2
        out_channels: 4  # = z_channels, the BB target latent
        resblock_updown: True
        use_scale_shift_norm: True
        use_spatial_transformer: False
      
      # Diffusion process parameters
      eta: 1.0
      loss_type: l1
      max_var: 1.0
      mt_type: linear
      num_timesteps: 1000
      objective: grad
      sample_step: 200
      sample_type: linear
      skip_sample: True
  
  # Conditional Stage (one SpatialRescaler per conditioning map: attention + attenuation).
  # n_stages=2 with the default multiplier=0.5 halves spatial size twice (64 -> 16 = latent res).
  # out_channels = VQGAN z_channels, so each rescaler produces a context block whose channel
  # count matches the BB latent. UNet in_channels is then 3 * z_channels (see notes above).
  CondStageParams:
    in_channels: 1
    n_stages: 2
    out_channels: 4
  
  # EMA (Exponential Moving Average)
  EMA:
    ema_decay: 0.995
    start_ema_step: 30000
    update_ema_interval: 8
    use_ema: True
  
  # UNet Segmentation Model (for Attention Map generation)
  AttentionMapSegmentation:
    # U-Net based segmentation for attention map extraction
    model_type: UNet
    in_channels: 1
    out_channels: 1
    features: [64, 128, 256, 512]
    dropout_rate: 0.1
  
  # Global model configuration
  latent_before_quant_conv: False
  normalize_latent: False
  only_load_latent_mean_std: False

  # Pre-exported attention maps (sigmoid probs, thresholded at 0.5 inside the model).
  # Produced by export_attention_maps.py using the trained AttentionMap UNet.
  attention_map_train_path: '/home/kacperzaleski/Projects/practical-work-CT2PET/data/processed/train/AttentionMaps'
  attention_map_val_path: '/home/kacperzaleski/Projects/practical-work-CT2PET/data/processed/val/AttentionMaps'

  model_name: CPDM
  model_type: CPDM

runner: CPDMRunner

# Training configuration (tuned for CPU demo; override via --max_epoch / --max_steps)
training:
  accumulate_grad_batches: 1
  n_epochs: 3
  n_steps: 400

  # sample_interval * epoch_length = global-step interval for in-training sampling.
  # Sampling runs the full BB reverse process (~200 timesteps), too expensive for CPU runs.
  sample_interval: 100
  save_interval: 1
  validation_interval: 1

  log_interval: 50

  use_amp: False
  grad_clip: 1.0

# Testing/Validation configuration
testing:
  clip_denoised: False
  sample_num: 1
  metrics:
    - lpips
    - mae
    - ssim
    - psnr

# Paths and logging
paths:
  results_dir: '/home/kacperzaleski/Projects/practical-work-CT2PET/results/CPDM'
  checkpoint_dir: '/home/kacperzaleski/Projects/practical-work-CT2PET/checkpoints/CPDM'
  log_dir: '/home/kacperzaleski/Projects/practical-work-CT2PET/logs/CPDM'
  
# Weights & Biases logging
wandb:
  project: 'CT2PET-CPDM'
  entity: null
  name: 'CPDM-AutoPET-64x64'
  notes: 'Complete CPDM training with VQGAN, BB Diffusion, and Attention Map Segmentation'
  log_frequency: 100
