# VQGAN Training Configuration — 64x64 head+torso, background-cropped variant.
# Same latent (4 x 16 x 16) as the legacy brain-64 VQGAN: ch_mult length 3 =>
# 2 downsamples => 64 -> 16, so the CPDM BB-UNet config stays unchanged.
# Differs from the legacy VQGAN-autoPET.yaml by: data_root -> processed_fullbody,
# a VGG-LPIPS perceptual term (0.1), and separate _fb64 checkpoint/log folders.
# Run with:
#   train_vqgan.py --config <this> --data-root data/processed_fullbody

data:
  dataset_name: 'CT2PET_autoPET_fullbody'
  dataset_type: 'ct2pet_aligned'
  dataset_config:
    data_root: '/home/kacperzaleski/Projects/practical-work-CT2PET/data/processed_fullbody'
    image_size: 64
    channels: 1
    to_normal: True
    flip: True

  train:
    batch_size: 16
    shuffle: True
    num_workers: 4

  val:
    batch_size: 16
    shuffle: False
    num_workers: 2

  test:
    batch_size: 16
    shuffle: False
    num_workers: 2

model:
  VQGAN:
    params:
      ddconfig:
        attn_resolutions: []
        ch: 128
        ch_mult: !!python/tuple [1, 2, 4]   # 2 downsamples: 64 -> 16 latent
        double_z: False
        dropout: 0.0
        in_channels: 1
        out_ch: 1
        num_res_blocks: 2
        resolution: 64
        z_channels: 4

      embed_dim: 4
      n_embed: 8192

      lossconfig:
        target: torch.nn.Identity

      disc_factor: 1.0
      disc_weight: 0.75
      codebook_weight: 1.0
      perceptual_weight: 1.0

  discriminator:
    params:
      n_layers: 3

  model_name: VQGAN
  model_type: VQGAN

runner: VQGANRunner

training:
  accumulate_grad_batches: 1
  n_epochs: 100
  n_steps: 100000
  sample_interval: 5
  save_interval: 5
  validation_interval: 5
  log_interval: 100
  use_amp: False
  grad_clip: 1.0
  # VGG-LPIPS perceptual term added to L1 + codebook (sharper decode for CPDM).
  # Kept small so it doesn't dominate L1 / drift intensities. CLI --perceptual-weight overrides.
  perceptual_weight: 0.1

testing:
  clip_denoised: False
  sample_num: 1

paths:
  results_dir: '/home/kacperzaleski/Projects/practical-work-CT2PET/results/VQGAN_fb64'
  checkpoint_dir: '/home/kacperzaleski/Projects/practical-work-CT2PET/checkpoints/VQGAN_fb64'
  log_dir: '/home/kacperzaleski/Projects/practical-work-CT2PET/logs/VQGAN_fb64'

wandb:
  project: 'CT2PET-VQGAN'
  entity: null
  name: 'VQGAN-AutoPET-64-headtorso-cropped'
  notes: 'VQGAN encoder/decoder at 64 (head+torso, cropped, +perceptual) for the CPDM fb64 run'
  log_frequency: 100
